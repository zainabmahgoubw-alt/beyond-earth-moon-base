<script id="sim">
/* ---- Simulation (pure rules, no visuals). All numbers are invented GAME UNITS. ---- */
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const initState=()=>({day:1,adv:0,power:60,water:55,meals:6,air:100,hunger:100,
 sys:{air:true,co2:true,wr:true,gl:true,comm:true},growth:0,harvest:0,ate:false,wstep:0,tested:false,sent:false,done:[],fin:[]});
const dailyUse=s=>(s.sys.air?5:0)+(s.sys.co2?3:0)+(s.sys.wr?2:0)+(s.sys.gl?5:0);
function advanceDay(s){
 const n=JSON.parse(JSON.stringify(s)),notes=[],run={};
 let a=n.power+10; // 1) generation
 const go=(k,c)=>{if(!n.sys[k])return;if(a>=c){a-=c;run[k]=1}else notes.push(k+'_nopower')};
 go('air',5);go('co2',3);go('wr',2); // 2) consumption by priority
 let w=n.water-8+(run.wr?5:0);
 if(n.sys.gl){if(a>=5&&w>=3){a-=5;w-=3;run.gl=1;n.growth++}else notes.push('gl_pause')}
 if(!run.co2){n.air-=20;notes.push('co2_off')}
 if(!run.air)n.air-=10;
 n.power=clamp(a);n.water=clamp(w);n.air=clamp(n.air);
 if(!n.ate){n.hunger=clamp(n.hunger-30);notes.push('hungry')}
 n.ate=false;
 if(n.growth>=3){n.growth=0;n.meals++;n.harvest++;notes.push('harvest')}
 n.day++;n.adv++;
 return{s:n,notes};
}
function eatMeal(s){if(s.meals<=0)return false;s.meals--;s.hunger=100;s.ate=true;return true}

<script>
const Aud=(()=>{let ctx,master,mus,sg,amb,send,nb,tm=0,vol=.6,mute=false,mode='intro',ci=0,nC=0,nB=0,nA=0,last={},lastAny=0;
try{const s=JSON.parse(localStorage.getItem('beAud'));if(s){vol=+s.v;mute=!!s.m}}catch(e){}
const CH=[[110,220,261.63,329.63,392],[87.31,174.61,220,261.63,329.63],[130.81,196,261.63,329.63,392],[98,196,246.94,293.66,392]],BELL=[440,523.25,659.25,783.99,880,1046.5];
const save=()=>{try{localStorage.setItem('beAud',JSON.stringify({v:vol,m:mute}))}catch(e){}};
function init(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}
 try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=ctx.createGain();master.gain.value=mute?0:vol;master.connect(ctx.destination);
 mus=ctx.createGain();mus.gain.value=.55;mus.connect(master);sg=ctx.createGain();sg.gain.value=.9;sg.connect(master);amb=ctx.createGain();amb.gain.value=0;amb.connect(master);
 const dl=ctx.createDelay(1.5);dl.delayTime.value=.45;const fb=ctx.createGain();fb.gain.value=.4;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;send=ctx.createGain();send.gain.value=.6;send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mus);
 const n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;nb=b;
 const hs=ctx.createBufferSource();hs.buffer=nb;hs.loop=true;const hf=ctx.createBiquadFilter();hf.type='lowpass';hf.frequency.value=170;hs.connect(hf);hf.connect(amb);hs.start();
 const ho=ctx.createOscillator();ho.frequency.value=55;const hg=ctx.createGain();hg.gain.value=.22;ho.connect(hg);hg.connect(amb);ho.start();
 setMode(mode);nC=ctx.currentTime+.1;nB=nC+1;nA=nC+6;if(!tm)tm=setInterval(sched,400);sched()}
function pad(fr,t,d){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=mode==='intro'?1400:800;f.connect(mus);fr.forEach((x,i)=>[-5,5].forEach(dt=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i?'triangle':'sine';o.frequency.value=x;o.detune.value=dt;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+2.5);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(f);o.start(t);o.stop(t+d+.1)}))}
function bell(fq,t){[1,2.01].forEach((m,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=fq*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09/(i+1),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3);o.connect(g);g.connect(mus);g.connect(send);o.start(t);o.stop(t+3.1)})}
function beep(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=1100+Math.random()*700;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(amb);o.start(t);o.stop(t+.3)}
function sched(){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime;
 while(nC<t+2){pad(CH[ci%4],nC,9);ci++;nC+=8}
 while(nB<t+2){if(Math.random()<(mode==='intro'?.9:.55))bell(BELL[Math.random()*6|0],nB);nB+=mode==='intro'?1.1+Math.random()*1.4:1.8+Math.random()*2.4}
 while(nA<t+2){if(mode==='game')beep(nA);nA+=7+Math.random()*8}}
function setMode(m){mode=m;if(!ctx)return;amb.gain.setTargetAtTime(m==='game'?.45:0,ctx.currentTime,1);mus.gain.setTargetAtTime(m==='game'?.45:.6,ctx.currentTime,1.2)}
function tone(f,t,d,ty,g,f2){const o=ctx.createOscillator(),e=ctx.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(sg);o.start(t);o.stop(t+d+.05)}
function whoosh(t,d,f1,f2,g){const s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);const e=ctx.createGain();e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+d*.3);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(e);e.connect(sg);s.start(t);s.stop(t+d+.05)}
const FX={
click:t=>tone(880,t,.08,'sine',.12,660),
select:t=>{tone(660,t,.1,'triangle',.14);tone(990,t+.06,.12,'triangle',.1)},
open:t=>tone(300,t,.2,'sine',.1,720),
close:t=>tone(700,t,.15,'sine',.1,300),
toggle:t=>{tone(520,t,.07,'square',.04);tone(780,t+.05,.07,'square',.04)},
step:t=>{tone(740,t,.09,'triangle',.12);tone(1110,t+.07,.1,'triangle',.1)},
confirm:t=>[523,659,784].forEach((f,i)=>tone(f,t+i*.07,.14,'triangle',.11)),
discover:t=>[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.09,.35,'sine',.1)),
win:t=>{[523,659,784,1047].forEach((f,i)=>{tone(f,t+i*.12,.5,'triangle',.12);tone(f*2,t+i*.12,.5,'sine',.05)})},
whoosh:t=>whoosh(t,.5,400,2400,.12),
launch:t=>{whoosh(t,.8,200,3000,.14);tone(200,t,.7,'sine',.07,800)},
zoom:t=>tone(500+Math.random()*120,t,.05,'sine',.05),
alert:t=>{tone(440,t,.12,'sine',.1);tone(440,t+.16,.12,'sine',.1)},
send:t=>{tone(400,t,.4,'sine',.1,1200);tone(1600,t+.3,.3,'triangle',.06)}};
function sfx(n){if(!ctx||ctx.state!=='running'||mute||!FX[n])return;const now=performance.now();if(now-lastAny<30||now-(last[n]||0)<(n==='zoom'?110:70))return;lastAny=last[n]=now;FX[n](ctx.currentTime+.005)}
function ap(){if(master)master.gain.setTargetAtTime(mute?0:vol,ctx.currentTime,.05);save()}
return{init,sfx,setMode,toggle(){mute=!mute;ap();return mute},setVol(v){vol=v;if(v>0)mute=false;ap()},get muted(){return mute},get vol(){return vol},pause(p){if(!ctx)return;p?ctx.suspend():ctx.resume()}}})();
const sfx=n=>Aud.sfx(n);
{const mb=document.getElementById('mb'),vl=document.getElementById('vol');
 const sy=()=>{mb.textContent=Aud.muted||Aud.vol===0?'🔇':'🔊';vl.value=Math.round(Aud.vol*100)};sy();
 mb.onclick=()=>{Aud.init();Aud.toggle();sy();sfx('click')};
 vl.oninput=()=>{Aud.init();Aud.setVol(vl.value/100);sy()};vl.onchange=()=>sfx('click');
 addEventListener('pointerdown',()=>Aud.init(),true);addEventListener('keydown',()=>Aud.init(),true);
 document.addEventListener('visibilitychange',()=>Aud.pause(document.hidden))}

<script>

const MSGS=['Hello Earth! The Moon base is ready.','Our plants are growing!','Thank you for helping us explore!'];
const MEALS=['Veggie pasta','Chicken and rice','Apple oatmeal'];
const OBJ=['Look around the habitat (drag to turn, scroll or use + and − to zoom)','Visit the air machine','Check that the air fans and CO₂ cleaner are ON','Visit the water machine','Test the water to make sure it is safe','Eat a meal in the galley','Send a message to Earth','Keep the base running for 3 mission days'];
const TX={
air:{n:'Air and Life Support',i:'Hey, Astronaut! This machine keeps your air fresh.',w:()=>young()?'It moves air around and cleans it, like a super air filter.':'This rack is a game version of an environmental control system. It circulates air and removes carbon dioxide (CO₂).',y:'You breathe in oxygen and breathe out CO₂. If CO₂ builds up, the air gets stale.',h:'Fans push air through a filter that catches CO₂, like a sponge for stale air.',x:'Make sure both switches are ON. Then press RUN SYSTEM CHECK.',m:'On the International Space Station, machines use electricity to make oxygen from water, and other machines remove CO₂. A real Moon base may use different tools, so this rack is a game idea inspired by that research.'},
water:{n:'Water Recovery',i:'Every drop counts up here!',w:()=>young()?'This unit cleans used water so we can use it again.':'This unit is a game version of a water recovery system. It collects used water, cleans it and tests it.',y:'Bringing water from Earth is very hard, so astronauts clean it and use it again.',h:'Collect, Filter, Purify, Test, Store. Each step does a different job.',x:'Open the Water Lab and do each step in order. The water must pass the TEST before it can be stored!',m:'On the ISS, a recovery system turns used water and moisture from the air back into drinking water. Clear water can still hold germs too tiny to see, so sensors and treatment matter more than how water looks.'},

 3:()=>{d.innerHTML=`<h1>What should we call you, Astronaut?</h1><label for="nm" class="sr">First name</label><input id="nm" maxlength="12" autocomplete="off" placeholder="Type your first name" value="${esc(P.name)}"><div class="err" id="er" role="alert"></div><button class="pri" data-a="nameNext">NEXT</button>`;setTimeout(()=>$('#nm')&&$('#nm').focus(),50)},

 5:()=>{d.innerHTML=`<h1>Where will you explore?</h1><div class="row"><div class="card"><span class="tag">Coming later</span><h2>ORION SPACECRAFT</h2><p>The capsule that carries astronauts to the Moon. It carries its own stored oxygen and nitrogen for the trip.</p><p><i>You can play here in a later update.</i></p></div><div class="card"><span class="tag">Coming later</span><h2>GATEWAY — LUNAR ORBIT</h2><p>A small space station planned to circle the Moon.</p><p><i>You can play here in a later update.</i></p></div><div class="card live"><span class="tag">Play now!</span><h2>MOON BASE — LUNAR SURFACE</h2><p>Keep a home on the Moon running with air, water, power and food.</p><button class="pri" data-a="play">ENTER MOON BASE</button></div></div>`}};
 if(n<6){sc[n]();ui.appendChild(d)}else game();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function game(){ui.innerHTML=`<div class="game"><div id="hud"></div><div class="mid"><div id="pn" class="pn" hidden></div></div><div id="bar" class="bar"></div><div id="ts" class="ts" role="status" hidden></div></div>`;hud();side();panel();focusRoom();
 if(!introSeen&&!S.done.length){introSeen=true;toast(`Welcome to your new lunar home, Astronaut ${P.name}. Your first job is to make sure the habitat is ready for its crew. Tap a glowing ⭐ to discover something!`)}}
function alerts(){const a=[];if(!S.sys.co2)a.push('The CO₂ cleaner is OFF. Visit the air machine!');if(S.air<60)a.push('The air score is low. Clean the filter at the air machine.');if(S.water<20)a.push('Water is getting low. Visit the water machine!');if(S.power<20)a.push('Your greenhouse needs more energy, but the air system needs power too. Which one should we protect first?');if(S.meals===0)a.push('No meals left. Your plants can grow more!');if(S.hunger<50)a.push('Your tummy is rumbling. Time for a meal!');return a}
function hud(){const el=$('#hud');if(!el)return;
 const m=(ic,v,c,t)=>`<div class="m" role="img" aria-label="${t}: ${Math.round(v)} out of 100"><span aria-hidden="true">${ic}</span><i><u style="width:${v}%;background:${c}"></u></i></div>`;
 el.innerHTML=`<div class="hr"><b>🧑‍🚀 ${esc(P.name)}</b><b>Day ${S.day}</b><b aria-label="Steps done">⭐ ${S.done.length}/8</b>${m('⚡',S.power,'#ffd36b','Power')}${m('💧',S.water,'#5ad1ff','Water')}${m('🌬️',S.air,S.air<60?'#ff8a8a':'#7dffb4','Air')}${m('😋',S.hunger,'#ffb347','Tummy')}<div class="m" role="img" aria-label="${S.meals} meals left">🍽️ ${S.meals}</div>${alerts().length?'<button data-a="alert" class="pulse" aria-label="Something needs attention">❗</button>':''}<button data-a="adv" class="pri" style="min-height:38px;font-size:15px" aria-label="Advance to next mission day">☀️ Next day</button></div>`}
function side(){const el=$('#bar');if(!el)return;el.innerHTML=`<button data-a="mis">🎯 Mission ${S.done.length}/8</button><button data-a="stl">🧭 Places</button><button data-a="zi" aria-label="Zoom in">＋</button><button data-a="zo" aria-label="Zoom out">−</button><button data-a="more">⚙️ More</button>`}
const ctl={
air:()=>`<div>Air score (game number): <b>${S.air}/100</b></div>${tg('air','Air circulation')}${tg('co2','CO₂ removal')}<button data-a="filter">Clean the filter</button><button class="pri" data-a="check">RUN SYSTEM CHECK</button>`,
water:()=>`<div>Step <b>${S.wstep+1} of 5</b> · Clean water: <b>${Math.round(S.water)} WU</b></div><button class="pri" data-a="lab" data-v="water">💧 Open the Water Lab</button>${tg('wr','Water recovery unit')}`,
power:()=>`<div>Battery: <b>${Math.round(S.power)} / 100 PU</b></div><div>Sun adds <b>+10</b> each day. Machines use <b>−${dailyUse(S)}</b>. Daily balance: <b>${10-dailyUse(S)>=0?'+':''}${10-dailyUse(S)} PU</b></div><div>Air fans 5 · CO₂ cleaner 3 · Water unit 2 · Grow lights 5</div>${tg('wr','Water recovery (2 PU)')}${tg('gl','Greenhouse lights (5 PU)')}`,
green:()=>`<div style="font-size:34px" aria-hidden="true">${['🌱','🌿','🌿','🥬'][S.growth]}</div><div>Growth: <b>${S.growth} / 3 days</b> · Water: <b>${Math.round(S.water)} WU</b></div><div>New meals grown: <b>${S.harvest}</b></div>${tg('gl','Grow lights')}`,
galley:()=>`<div>Meals left: <b>${S.meals}</b> · Tummy: <b>${S.hunger}/100</b></div>${MEALS.map(m=>`<button data-a="meal" data-v="${m}" class="${G.meal===m?'on':''}">${m}</button>`).join('')}<button data-a="prep" ${G.meal&&!G.ready?'':'disabled'}>PREPARE</button><button class="pri" data-a="eat" ${G.ready?'':'disabled'}>EAT</button>`,
comm:()=>`<div>Antenna: <b>${S.sys.comm?'ON':'OFF'}</b></div>${tg('comm','Antenna')}${['Hello Earth! The Moon base is ready.','Our plants are growing!','Thank you for helping us explore!'].map((m,i)=>`<button data-a="msg" data-v="${i}">Send: "${m}"</button>`).join('')}`};
const tg=(k,l)=>`<button data-a="tgl" data-v="${k}" class="${S.sys[k]?'on':''}" aria-pressed="${S.sys[k]}">${l}: ${S.sys[k]?'ON':'OFF'}</button>`;
let info='';
function panel(){const el=$('#pn');if(!el)return;if(!cur){el.hidden=true;el.innerHTML='';return}
 const t=TX[cur];el.hidden=false;
 el.innerHTML=`<button class="x" data-a="close" aria-label="Close panel">✕</button><h2>${t.n}</h2><p><b>${t.i}</b></p><p class="ins">👉 ${t.x}</p><div class="ctl">${ctl[cur]()}</div><p class="fb" role="status">${fb}</p>${cur==='water'?'':`<button data-a="lab" data-v="${cur}">🔬 See it step by step</button>`}<div class="row" style="justify-content:flex-start;margin-top:6px">${[['w','What is it?'],['y','Why do we need it?'],['h','How does it work?'],['m','More science']].map(k=>`<button data-a="info" data-v="${k[0]}" class="${info===k[0]?'on':''}" aria-pressed="${info===k[0]}">⭐ ${k[1]}</button>`).join('')}</div>${info?`<p class="fb">${info==='w'?t.w():t[info]}</p>`:''}`}
function refresh(){hud();side();panel();r3();save();if(L)drawLab()}
/* ---------- Actions ---------- */
function open(id){if(id==='window'){lookWindow();return}cur=null;fb='';info='';if(id==='air')done(2);if(id==='water')done(4);focusStation(id);openLab(id);refresh()}
function checkEnd(){if(S.done.length>=7&&S.adv>=3&&!S.done.includes(8)){if(S.sys.air&&S.sys.co2&&S.air>=50){done(8);debrief()}else toast('Almost there! Get the air machines running again to finish your mission.')}}
function waterStep(){const m=['Great! Used water from sinks and the air is gathered so none is wasted.','Filters catch bits you can see, like dust and hair.','Purifying takes care of germs that are too tiny to see.','Clear water can still hide tiny germs. Sensors check it, because looks can fool us!',null];
  if(S.wstep===3){S.tested=true;done(5)}
  if(S.wstep===4){if(!S.tested){fb='Not quite! The water must be tested first.';refresh();return}S.water=clamp(S.water+15);fb='Clean water stored! You added 15 WU to the tank.';S.wstep=0;S.tested=false}else{fb=m[S.wstep];S.wstep++}refresh()}
function act(a,d){
 const v=d.v;const md=$('#md');if(md)md.remove();lastObj='';sfx(SFXMAP[a]||'click');
 if(a==='start')go(2);else if(a==='cont'){const sv=load();P=sv.P;S=sv.S;S.fin=S.fin||[];go(6)}
 else if(a==='age'){P.age=+v;go(2)}else if(a==='ageNext'){if(P.age)go(3)}
 else if(a==='nameNext'){const n=($('#nm').value||'').trim();if(!/^[\p{L}][\p{L}' -]{0,11}$/u.test(n)){$('#er').textContent='Please type just your first name, using letters (up to 12).';return}P.name=n;S=initState();save();go(4)}
 else if(a==='explore')go(5);else if(a==='play'){introSeen=false;go(6);save()}
 else if(a==='st')open(v);else if(a==='close'){cur=null;sel(null);focusRoom();refresh()}else if(a==='all'){cur=null;sel(null);focusRoom();refresh()}
 else if(a==='zi')gd=clamp(gd-3,6,26);else if(a==='zo')gd=clamp(gd+3,6,26);else if(a==='reset'){cur=null;sel(null);focusRoom();refresh()}
 else if(a==='tgl'){S.sys[v]=!S.sys[v];fb=S.sys[v]?'Nice! That machine is working again.':(v==='co2'?'The CO₂ cleaner is resting. Your air score will drop tomorrow unless you turn it back ON.':'Switched OFF. This machine will not use power until you turn it back ON.');if(v==='comm'&&!S.sys.comm)fb='The antenna is OFF. Turn it ON to talk to Earth.';refresh()}
 else if(a==='filter'){if(!S.sys.co2)fb='Turn the CO₂ removal ON first. Then the clean filter can help!';else{S.air=clamp(S.air+30);fb=`Filter cleaned! A clean filter catches CO₂ better. Air score: ${S.air}.`}refresh()}
 else if(a==='check'){if(S.sys.air&&S.sys.co2){done(3);fb='All systems go! The fans are spinning and the CO₂ cleaner is working. Fresh air for the whole crew!'}else fb='Not quite! One of the air switches is OFF. Which one needs to be ON?';refresh()}
 else if(a==='wnext'){waterStep()}
 else if(a==='meal'){G.meal=v;G.ready=false;fb=`You picked ${v}. Now press PREPARE.`;refresh()}
 else if(a==='prep'){G.ready=true;fb='Smells good! Your meal is ready. Press EAT.';refresh()}
 else if(a==='eat'){if(eatMeal(S)){G.ready=false;G.meal=null;done(6);fb='Yum! Your tummy is full again. Food gives your body energy to work and explore.'}else fb='No meals left. Grow some plants!';refresh()}
 else if(a==='pickmsg'){G.msg=+v;fb='Nice choice! Now turn the antenna ON, then press SEND.';refresh()}
 else if(a==='send'){if(G.msg==null)fb='Pick a message first!';else if(!S.sys.comm)fb='Turn the antenna ON first!';else{S.sent=true;done(7);fb='Message sent! From the Moon, a signal takes about 1.3 seconds on average to reach Earth. The real time changes a little because the Moon moves.';if(L&&L.id==='comm')L.i=3}refresh()}
 else if(a==='msg'){if(!S.sys.comm){fb='Turn the antenna ON first!';}else{S.sent=true;done(7);fb='Message sent! From the Moon, a signal takes about 1.3 seconds on average to reach Earth. The real time changes a little because the Moon moves.'}refresh()}
 else if(a==='adv'){const o=S,r=advanceDay(S);S=r.s;const m=r.notes.map(n=>NM[n]).filter(Boolean);fb='';refresh();modal(dayReport(o,S,m));checkEnd()}
 else if(a==='rad'){toast('Space has tiny fast particles called radiation. Real bases use thick walls and shelters to help keep crews safe. In this game it is just a fact card, so there is nothing to manage yet!')}
 else if(a==='src')sources();else if(a==='newgame'){if(confirm('Start over? Your saved game will be erased.')){try{localStorage.removeItem(KEY)}catch(e){}S=initState();cur=null;introSeen=false;closeLab();go(1)}}
 else if(a==='info'){info=info===v?'':v;if(L)drawLab()}
 else if(a==='alert')toast(alerts()[0])
 else if(a==='mis')modal(`<h2>🎯 YOUR FIRST DAY ON THE MOON</h2><div class="ctl">${OBJ.map((o,i)=>{const ok=S.done.includes(i+1),st=OB2[i];return `<div class="fb">${ok?'✅':'⬜'} <b>Step ${i+1}</b> ${st[0]} ${o}${i===7?`<div style="font-size:26px" aria-label="${S.adv} of 3 days done">${[0,1,2].map(k=>k<S.adv?'☀️':'⚪').join(' ')}</div>`:''}${st[1]&&!ok?` <button data-a="st" data-v="${st[1]}">Show me</button>`:''}</div>`}).join('')}</div>`)
 else if(a==='stl')modal(`<h2>🧭 Where do you want to go?</h2><div class="ctl">${Object.keys(TX).map(k=>`<button data-a="st" data-v="${k}">${TX[k].n}</button>`).join('')}<button data-a="all">Whole room view</button></div>`)
 else if(a==='more')modal(`<h2>⚙️ More</h2><p>📡 Comms: <b>${S.sys.comm?'Online':'Off'}</b> · 🏠 Cabin pressure: <b>Steady</b> (game light)</p><div class="ctl"><button data-a="reset">Reset view</button><button data-a="window">🌍 Look out the window</button><button data-a="dest">🌌 Other destinations</button><button data-a="rad">Space weather info</button><button data-a="src">Where does the science come from?</button><button data-a="newgame">New game</button></div>`)
 else if(a==='lab')openLab(v)
 else if(a==='lstep'){if(L){L.i=+v;fb='';drawLab()}}else if(a==='lback'){if(L&&L.i>0){L.i--;fb='';drawLab()}}else if(a==='lnext'){if(L&&L.i<VIS[L.id].length-1){L.i++;fb='';drawLab()}}else if(a==='lclose'){closeLab();sel(null);focusRoom()}
 else if(a==='ldo'){if(!L)return;const was=S.wstep;waterStep();if(was===4){celebrate('water')}else{L.i=S.wstep;drawLab()}}
 else if(a==='lfin'){if(L)celebrate(L.id)}
 else if(a==='next'){closeLab();sel(null);focusRoom();refresh()}
 else if(a==='skip'){introK=ISC.length-1;introShow()}
 else if(a==='window')lookWindow()
 else if(a==='dest')go(5)
 else if(a==='keep'){}
}
function dayReport(o,n,m){const row=(ic,l,a,b,u)=>{const d=Math.round(b-a);return `<div class="fb">${ic} <b>${l}</b>: ${Math.round(a)} → ${Math.round(b)} ${u} <b style="color:${d<0?'#ff8a8a':d>0?'#7dffb4':'#ccc'}">${d>0?'▲ +'+d:d<0?'▼ '+d:'• same'}</b></div>`};
 return `<div style="font-size:54px;text-align:center" class="bob" aria-hidden="true">🌅</div><h2>Day ${o.day} is done!</h2>${row('⚡','Power',o.power,n.power,'PU')}${row('💧','Water',o.water,n.water,'WU')}${row('🌬️','Air score',o.air,n.air,'')}${row('😋','Tummy',o.hunger,n.hunger,'')}${row('🍽️','Meals',o.meals,n.meals,'')}${row('🌱','Plant growth',o.growth,n.growth,'/ 3')}<p>${m.join(' ')||'All your systems worked well. Great job!'}</p>`}
function modal(h){const o=$('#md');if(o)o.remove();const d=document.createElement('div');d.className='scr modal';d.id='md';d.innerHTML=`<div role="dialog" aria-modal="true"><button class="x" data-a="keep" aria-label="Close">✕</button>${h}</div>`;ui.appendChild(d)}
function debrief(){burst();sfx('win');modal(`<div class="stars" aria-hidden="true">⭐⭐⭐</div><h2 style="text-align:center;padding:0">Awesome! You did it! 🚀</h2><p style="text-align:center;font-size:20px">Astronaut ${esc(P.name)}, your Moon base is ready!</p><p style="text-align:center">Ready for your next space adventure?</p><div class="row"><button class="pri big" data-a="keep">Keep exploring ▶</button></div>`)}
